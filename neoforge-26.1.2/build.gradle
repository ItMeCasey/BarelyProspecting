plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir "../version-26.1.2/src/main/java"
        java.srcDir "../common/src/main/java"
        resources.srcDir "../version-26.1.2/src/main/resources"
        resources.srcDir "../common/src/main/resources"
    }
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
            if (project.hasProperty('devTools')) { systemProperty 'barelyprospecting.dev', 'true' }
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // The headless self test runs here (no EULA needed): barelyprospecting.selftest starts it once the server is up.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'barelyprospecting.selftest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// neoforge.mods.toml is a template: this fills in its ${} values from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Unit tests for the shared logic (food math, comparator ranking); they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
// Development tools (self test, screenshot tour) live in src/dev and only build with -PdevTools, so a normal build and the
// release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-26.1.2/src/dev/java'
    sourceSets.main.java.srcDir 'src/dev/java'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// --- Optional integrations (BEI, SMWTI, Jade, JEI, REI, EMI): compile-only, loaded by the other mod when it is installed ---
def imcUser = System.getenv("IMC_MAVEN_USER") ?: project.findProperty("imcMavenUser")
def imcPass = System.getenv("IMC_MAVEN_PASSWORD") ?: project.findProperty("imcMavenPassword")
repositories {
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey Maven'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
        }
    }
    maven { name = 'Cursemaven (fallback)'; url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}
def devMods = (project.findProperty("devMods") ?: "").toString().split(",").collect { it.trim() }
dependencies {
    if (imcUser && imcPass) {
        compileOnly "com.itmecasey:bei-api:26.1.2-neoforge-2026.11.7"
        compileOnly "com.itmecasey:smwti-api:26.1.2-neoforge-2026.11.2"
    } else {
        compileOnly files('libs/bei-api-26.1.2-neoforge-2026.11.7.jar', 'libs/smwti-api-26.1.2-neoforge-2026.11.2.jar')
    }
    compileOnly "curse.maven:jade-324717:9156414"
    if (devMods.contains("jade") || devMods.contains("all")) localRuntime "curse.maven:jade-324717:9156414"
    compileOnly "curse.maven:jei-238222:9384706"
    if (devMods.contains("jei") || devMods.contains("all")) localRuntime "curse.maven:jei-238222:9384706"
    compileOnly "curse.maven:roughly-enough-items-310111:8271478"
    if (devMods.contains("rei") || devMods.contains("all")) localRuntime "curse.maven:roughly-enough-items-310111:8271478"
    if (devMods.contains("bei") || devMods.contains("smwti") || devMods.contains("all")) {
        fileTree("devlibs").matching { include "*.jar" }.each { f -> if ((devMods.contains("bei") && f.name.startsWith("bei-")) || (devMods.contains("smwti") && f.name.startsWith("smwti-")) || devMods.contains("all")) { runtimeOnly files(f) } }
    }
}
sourceSets.main.java.srcDir '../version-26.1.2/src/jade/java'
sourceSets.main.java.srcDir '../version-26.1.2/src/jei/java'
sourceSets.main.java.srcDir '../version-26.1.2/src/rei/java'
