plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

base.archivesName = "${mod_id}-forge-mc${minecraft_version}"
version = mod_version
group = mod_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir '../version-1.20.1/src/main/java'
        java.srcDir '../common/src/main/java'
        resources.srcDir '../version-1.20.1/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            if (project.hasProperty('devTools')) { property 'barelyprospecting.dev', 'true' }
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            // -PwindowSize=1904x1041 opens the dev client at that size (the screenshot checks need the same layout every run).
            if (project.hasProperty('windowSize')) {
                args '--width', project.property('windowSize').split('x')[0], '--height', project.property('windowSize').split('x')[1]
            }
        }
        server {
            args '--nogui'
        }
        // The headless self test runs here (no EULA needed): barelyprospecting.selftest starts it once the server is up.
        gameTestServer {
            property 'barelyprospecting.selftest', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

}

// Fills in mods.toml and pack.mcmeta from gradle.properties, the same way the NeoForge builds fill in neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
        ])
    }
    // 1.20.1 runs on SRG names, so the jar is remapped.
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Unit tests for the shared logic; they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
// Development tools (self test, screenshot tour) live in src/dev and only build with -PdevTools, so a normal build and the
// release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-1.20.1/src/dev/java'
    sourceSets.main.java.srcDir 'src/dev/java'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// --- Optional integrations (BEI, SMWTI, Jade, JEI, REI, EMI): compile-only, loaded by the other mod when it is installed ---
def imcUser = System.getenv("IMC_MAVEN_USER") ?: project.findProperty("imcMavenUser")
def imcPass = System.getenv("IMC_MAVEN_PASSWORD") ?: project.findProperty("imcMavenPassword")
repositories {
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey Maven'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
        }
    }
    maven { name = 'Cursemaven (fallback)'; url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me'; content { includeGroup 'me.shedaniel.cloth' } }
}
def devMods = (project.findProperty("devMods") ?: "").toString().split(",").collect { it.trim() }
dependencies {
    if (imcUser && imcPass) {
        compileOnly "com.itmecasey:bei-api:1.20.1-forge-2026.11.7"
        compileOnly "com.itmecasey:smwti-api:1.20.1-forge-2026.11.2"
    } else {
        compileOnly files('libs/bei-api-1.20.1-forge-2026.11.7.jar', 'libs/smwti-api-1.20.1-forge-2026.11.2.jar')
    }
    compileOnly fg.deobf("curse.maven:jade-324717:8479276")
    if (devMods.contains("jade") || devMods.contains("all")) runtimeOnly fg.deobf("curse.maven:jade-324717:8479276")
    compileOnly fg.deobf("curse.maven:jei-238222:9394360")
    if (devMods.contains("jei") || devMods.contains("all")) runtimeOnly fg.deobf("curse.maven:jei-238222:9394360")
    compileOnly fg.deobf("curse.maven:roughly-enough-items-310111:5846923")
    if (devMods.contains("rei") || devMods.contains("all")) runtimeOnly fg.deobf("curse.maven:roughly-enough-items-310111:5846923")
    compileOnly fg.deobf("curse.maven:emi-580555:8081375")
    if (devMods.contains("emi") || devMods.contains("all")) runtimeOnly fg.deobf("curse.maven:emi-580555:8081375")
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    compileOnly fg.deobf("curse.maven:architectury-api-419699:5137938")
    if (devMods.contains("rei") || devMods.contains("all")) runtimeOnly fg.deobf("curse.maven:architectury-api-419699:5137938")
    if (devMods.contains("rei") || devMods.contains("all")) runtimeOnly fg.deobf("curse.maven:cloth-config-348521:5729105")
}
sourceSets.main.java.srcDir '../version-1.20.1/src/jade/java'
sourceSets.main.java.srcDir '../version-1.20.1/src/jei/java'
sourceSets.main.java.srcDir '../version-1.20.1/src/rei/java'
sourceSets.main.java.srcDir '../version-1.20.1/src/emi/java'
