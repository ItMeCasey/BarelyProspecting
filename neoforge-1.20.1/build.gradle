plugins {
    id 'idea'
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir '../version-1.20.1/src/main/java'
        java.srcDir '../forge-1.20.1/src/main/java'
        java.srcDir '../common/src/main/java'
        resources.srcDir '../version-1.20.1/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

repositories {
    mavenCentral()
}

legacyForge {
    // NeoForge's 1.20.1 fork of Forge 47 keeps the net.minecraftforge packages.
    enable {
        neoForgeVersion = project.minecraft_version + '-' + project.forge_version
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            if (project.hasProperty('devTools')) { systemProperty 'barelyprospecting.dev', 'true' }
        }
        client {
            client()
            // -PwindowSize=1904x1041 opens the dev client at that size (the screenshot checks need the same layout every run).
            if (project.hasProperty('windowSize')) {
                programArgument '--width'
                programArgument project.property('windowSize').split('x')[0]
                programArgument '--height'
                programArgument project.property('windowSize').split('x')[1]
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        // The headless self test runs here (no EULA needed): barelyprospecting.selftest starts it once the server is up.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'barelyprospecting.selftest', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// mods.toml and pack.mcmeta are templates: this fills in their ${} values from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

dependencies {
}

// Unit tests for the shared logic; they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
// Development tools (self test, screenshot tour) live in src/dev and only build with -PdevTools, so a normal build and the
// release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-1.20.1/src/dev/java'
    sourceSets.main.java.srcDir '../forge-1.20.1/src/dev/java'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// --- Optional integrations (BEI, SMWTI, Jade, JEI, REI, EMI): compile-only, loaded by the other mod when it is installed ---
def imcUser = System.getenv("IMC_MAVEN_USER") ?: project.findProperty("imcMavenUser")
def imcPass = System.getenv("IMC_MAVEN_PASSWORD") ?: project.findProperty("imcMavenPassword")
repositories {
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey Maven'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
        }
    }
    maven { name = 'Cursemaven (fallback)'; url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}
def devMods = (project.findProperty("devMods") ?: "").toString().split(",").collect { it.trim() }
dependencies {
    if (imcUser && imcPass) {
        compileOnly "com.itmecasey:bei-api:1.20.1-neoforge-2026.11.7"
        compileOnly "com.itmecasey:smwti-api:1.20.1-neoforge-2026.11.2"
    } else {
        compileOnly files('libs/bei-api-1.20.1-neoforge-2026.11.7.jar', 'libs/smwti-api-1.20.1-neoforge-2026.11.2.jar')
    }
    modCompileOnly "curse.maven:jade-324717:8479276"
    if (devMods.contains("jade") || devMods.contains("all")) modLocalRuntime "curse.maven:jade-324717:8479276"
}
sourceSets.main.java.srcDir '../version-1.20.1/src/jade/java'
