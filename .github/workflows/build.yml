name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plan:
    # Picks the layers whose code changed in this push or pull request. Docs, status, wiki, branding and workflow-only changes pick none.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 .github/scripts/plan_matrix.py build --merge-base --before "$PR_BASE" --sha "$PR_HEAD"
          else
            python3 .github/scripts/plan_matrix.py build --before "$PUSH_BEFORE" --sha "$PUSH_SHA"
          fi

  build:
    # Build, run the common unit tests, and run the headless self test (a real server, real deaths) for each layer the plan picked.
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      IMC_MAVEN_USER: ${{ secrets.IMC_MAVEN_USER }}
      IMC_MAVEN_PASSWORD: ${{ secrets.IMC_MAVEN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x ${{ matrix.layer }}/gradlew
      - name: Build and unit tests
        working-directory: ${{ matrix.layer }}
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.layer }}
          path: |
            ${{ matrix.layer }}/build/libs/*.jar
            !${{ matrix.layer }}/build/libs/*-sources.jar
            !${{ matrix.layer }}/build/libs/*-dev.jar
      - name: Headless self test (game test server, no EULA needed)
        # Runs after the jars are uploaded: -PdevTools rebuilds the jar with the dev tools in it.
        working-directory: ${{ matrix.layer }}
        run: |
          # The game test server can keep the process alive after the checks finish; stop it after 8 minutes.
          # Pass or fail is decided by the grep checks below, not by the exit code.
          timeout 480 ./gradlew runGameTestServer -PdevTools --no-daemon 2>&1 | tee selftest.log || true
          grep -q "SELFTEST DONE failures=0" selftest.log
          ! grep -q "SELFTEST FAIL" selftest.log
          test "$(grep -c "SELFTEST PASS" selftest.log)" -ge 40

  package:
    # The jars of the layers that were built, one per loader and Minecraft version. Forge and NeoForge builds of a version
    # share class names with different code, so they are never merged into one jar.
    needs: [plan, build]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: layers
      - name: Collect the jars
        run: |
          mkdir -p dist
          cp layers/*/barelyprospecting-*.jar dist/
          ls -la dist
          test "$(ls dist/*.jar | wc -l)" -eq "${{ needs.plan.outputs.count }}"
      - name: The release jars hold no development tools
        run: |
          for jar in dist/*.jar; do
            if unzip -l "$jar" | grep -E "/dev/|SelfTest|test_tank|DevHooks"; then echo "dev files in $jar"; exit 1; fi
          done
      - uses: actions/upload-artifact@v5
        with:
          name: jars
          path: dist/*.jar
