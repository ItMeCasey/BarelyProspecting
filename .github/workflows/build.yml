name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  versions:
    # Releases are tagged v<mod_version>, so every module must carry the same number.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: All modules agree on mod_version
        run: |
          versions=$(grep -h '^mod_version=' */gradle.properties | sort -u)
          echo "$versions"
          test "$(echo "$versions" | wc -l)" -eq 1

  build:
    # Build, run the common unit tests, and run the headless self test (a real server, real deaths) for every module.
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - {layer: neoforge-1.20.1, java: 17}
          - {layer: forge-1.20.1, java: 17}
          - {layer: neoforge-1.21.1, java: 21}
          - {layer: forge-1.21.1, java: 21}
          - {layer: neoforge-26.1.2, java: 25}
          - {layer: forge-26.1.2, java: 25}
          - {layer: neoforge-26.2, java: 25}
          - {layer: forge-26.2, java: 25}
          - {layer: neoforge-26.3, java: 25}
          - {layer: forge-26.3, java: 25}
    runs-on: ubuntu-latest
    env:
      IMC_MAVEN_USER: ${{ secrets.IMC_MAVEN_USER }}
      IMC_MAVEN_PASSWORD: ${{ secrets.IMC_MAVEN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x ${{ matrix.layer }}/gradlew
      - name: Build and unit tests
        working-directory: ${{ matrix.layer }}
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.layer }}
          path: |
            ${{ matrix.layer }}/build/libs/*.jar
            !${{ matrix.layer }}/build/libs/*-sources.jar
            !${{ matrix.layer }}/build/libs/*-dev.jar
      - name: Headless self test (game test server, no EULA needed)
        # Runs after the jars are uploaded: -PdevTools rebuilds the jar with the dev tools in it.
        working-directory: ${{ matrix.layer }}
        run: |
          # The game test server can keep the process alive after the checks finish; stop it after 8 minutes.
          # Pass or fail is decided by the grep checks below, not by the exit code.
          timeout 480 ./gradlew runGameTestServer -PdevTools --no-daemon 2>&1 | tee selftest.log || true
          grep -q "SELFTEST DONE failures=0" selftest.log
          ! grep -q "SELFTEST FAIL" selftest.log
          test "$(grep -c "SELFTEST PASS" selftest.log)" -ge 40

  package:
    # The ten jars, one per loader and Minecraft version. Forge and NeoForge builds of a version share class names with
    # different code, so they are never merged into one jar.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: layers
      - name: Collect the jars
        run: |
          mkdir -p dist
          cp layers/*/barelyprospecting-*.jar dist/
          ls -la dist
          test "$(ls dist/*.jar | wc -l)" -eq 10
      - name: The release jars hold no development tools
        run: |
          for jar in dist/*.jar; do
            if unzip -l "$jar" | grep -E "/dev/|SelfTest|test_tank|DevHooks"; then echo "dev files in $jar"; exit 1; fi
          done
      - uses: actions/upload-artifact@v5
        with:
          name: jars
          path: dist/*.jar
