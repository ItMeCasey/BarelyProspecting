name: Wrong drops or a stuck step
description: A panning, crushing, soaking, crucible or lure step gives the wrong result or does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: "2026.11.1"
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader and Minecraft version
      placeholder: "NeoForge 1.21.1"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which block and tool, what you did, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your config
      description: The contents of barelyprospecting-common.toml, if you changed it.
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Recipe viewers, in-world info mods, anything else that touches blocks or drops.
