plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

base.archivesName = "${mod_id}-forge-mc${minecraft_version}"
version = mod_version
group = mod_group

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// Shared code lives in ../common and is compiled into this loader layer.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir '../version-26.1.2/src/main/java'
        java.srcDir '../common/src/main/java'
        resources.srcDir '../version-26.1.2/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            if (project.hasProperty('devTools')) { systemProperty 'barelyprospecting.dev', 'true' }
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client') {
            // -PwindowSize=1904x1041 opens the dev client at that size (the screenshot checks need the same layout every run).
            if (project.hasProperty('windowSize')) {
                args '--width', project.property('windowSize').split('x')[0], '--height', project.property('windowSize').split('x')[1]
            }
        }
        register('server') {
            args '--nogui'
        }
        // The headless self test runs here (no EULA needed): barelyprospecting.selftest starts it once the server is up.
        register('gameTestServer') {
            systemProperty 'barelyprospecting.selftest', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Fills in mods.toml and pack.mcmeta from gradle.properties. Forge jars need the pack.mcmeta.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: forge_version,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Unit tests for the shared logic; they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
// Development tools (self test, screenshot tour) live in src/dev and only build with -PdevTools, so a normal build and the
// release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-26.1.2/src/dev/java'
    sourceSets.main.java.srcDir 'src/dev/java'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// --- Optional integrations (BEI, SMWTI, Jade, JEI, REI, EMI): compile-only, loaded by the other mod when it is installed ---
def imcUser = System.getenv("IMC_MAVEN_USER") ?: project.findProperty("imcMavenUser")
def imcPass = System.getenv("IMC_MAVEN_PASSWORD") ?: project.findProperty("imcMavenPassword")
repositories {
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey Maven'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
        }
    }
    maven { name = 'Cursemaven (fallback)'; url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}
def devMods = (project.findProperty("devMods") ?: "").toString().split(",").collect { it.trim() }
dependencies {
    if (imcUser && imcPass) {
        compileOnly "com.itmecasey:bei-api:26.1.2-forge-2026.11.7"
        compileOnly "com.itmecasey:smwti-api:26.1.2-forge-2026.11.2"
    } else {
        compileOnly files('libs/bei-api-26.1.2-forge-2026.11.7.jar', 'libs/smwti-api-26.1.2-forge-2026.11.2.jar')
    }
    if (devMods.contains("bei") || devMods.contains("smwti") || devMods.contains("all")) {
        fileTree("devlibs").matching { include "*.jar" }.each { f -> if ((devMods.contains("bei") && f.name.startsWith("bei-")) || (devMods.contains("smwti") && f.name.startsWith("smwti-")) || devMods.contains("all")) { runtimeOnly files(f) } }
    }
}
