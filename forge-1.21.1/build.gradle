plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.47,6.2)'
}

base.archivesName = "${mod_id}-forge-mc${minecraft_version}"
version = mod_version
group = mod_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir '../version-1.21.1/src/main/java'
        java.srcDir '../common/src/main/java'
        resources.srcDir '../version-1.21.1/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

// Dev runs find the mod in one directory, so keep resources next to the compiled classes.
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory.get().asFile

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    reobf = false
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            if (project.hasProperty('devTools')) { property 'barelyprospecting.dev', 'true' }
            property 'eventbus.api.strictRuntimeChecks', 'true'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            // -PwindowSize=1904x1041 opens the dev client at that size (the screenshot checks need the same layout every run).
            if (project.hasProperty('windowSize')) {
                args '--width', project.property('windowSize').split('x')[0], '--height', project.property('windowSize').split('x')[1]
            }
        }
        server {
            args '--nogui'
        }
        // The headless self test runs here (no EULA needed): barelyprospecting.selftest starts it once the server is up.
        gameTestServer {
            property 'barelyprospecting.selftest', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// Fills in mods.toml from gradle.properties, the same way the NeoForge module fills in neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: forge_version,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Unit tests for the shared logic (food math, comparator ranking); they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
// Development tools (self test, screenshot tour) live in src/dev and only build with -PdevTools, so a normal build and the
// release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-1.21.1/src/dev/java'
    sourceSets.main.java.srcDir 'src/dev/java'
    sourceSets.main.resources.srcDir '../version-1.21.1/src/dev/resources'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// --- Optional integrations (BEI, SMWTI, Jade, JEI, REI, EMI): compile-only, loaded by the other mod when it is installed ---
def imcUser = System.getenv("IMC_MAVEN_USER") ?: project.findProperty("imcMavenUser")
def imcPass = System.getenv("IMC_MAVEN_PASSWORD") ?: project.findProperty("imcMavenPassword")
repositories {
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey Maven'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
        }
    }
    maven { name = 'Cursemaven (fallback)'; url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me'; content { includeGroup 'me.shedaniel.cloth' } }
}
def devMods = (project.findProperty("devMods") ?: "").toString().split(",").collect { it.trim() }
dependencies {
    if (imcUser && imcPass) {
        compileOnly "com.itmecasey:bei-api:1.21.1-forge-2026.11.7"
        compileOnly "com.itmecasey:smwti-api:1.21.1-forge-2026.11.2"
    } else {
        compileOnly files('libs/bei-api-1.21.1-forge-2026.11.7.jar', 'libs/smwti-api-1.21.1-forge-2026.11.2.jar')
    }
    compileOnly fg.deobf("curse.maven:jei-238222:9393325")
    if (devMods.contains("jei") || devMods.contains("all")) runtimeOnly fg.deobf("curse.maven:jei-238222:9393325")
}
sourceSets.main.java.srcDir '../version-1.21.1/src/jei/java'
